upstream acarindex_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name beta.acarindex.com;

    server_tokens off;
    auth_basic "AcarIndex Beta";
    auth_basic_user_file /etc/nginx/.htpasswd-acarindex-beta;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(env|git|dump|sql) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://acarindex_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/beta.acarindex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.acarindex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = beta.acarindex.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name beta.acarindex.com;
    return 404;
}
