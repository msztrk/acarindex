# Production stack — sunucuda .env.production ile (secret Git dışında)
name: acarindex-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: acarindex_prod_pg
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acarindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acarindex}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acarindex} -d ${POSTGRES_DB:-acarindex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: acarindex-migrate:${MIGRATE_IMAGE_TAG:-latest}
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: acarindex-web:${APP_IMAGE_TAG:-latest}
    container_name: acarindex_prod_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pg_data: